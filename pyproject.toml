[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaitya-core"
version = "0.1.0a1"
description = "Event-driven microkernel for personal automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Chaitya Contributors" },
]
keywords = ["automation", "microkernel", "event-driven", "adapter", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
chaitya = "chaitya.core.cli:main"

[project.urls]
Homepage = "https://github.com/chaitya-core/chaitya"
Documentation = "https://github.com/chaitya-core/chaitya/tree/main/docs"
Repository = "https://github.com/chaitya-core/chaitya"
Issues = "https://github.com/chaitya-core/chaitya/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chaitya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

