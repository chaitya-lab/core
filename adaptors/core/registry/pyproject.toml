[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaitya-adapter-registry"
version = "0.1.0a1"
description = "Registry adapter for Chaitya Core — discovers, lists, and validates other adapters."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."chaitya.adapters"]
registry = "chaitya_adapter_registry"

[tool.hatch.build.targets.wheel]
packages = ["src/chaitya_adapter_registry"]
