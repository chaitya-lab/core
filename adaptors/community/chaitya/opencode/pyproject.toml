[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaitya-adapter-opencode"
version = "0.1.0a1"
description = "OpenCode AI agent adaptor for Chaitya Core — CLI-driven sessions"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/chaitya_adapter_opencode"]
