[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaitya-sdk"
version = "0.1.0a1"
description = "SDK for building Chaitya adapters — the only kernel surface adapters touch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Chaitya Contributors" },
]
keywords = ["chaitya", "adapter", "sdk", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chaitya-lab/core"
Documentation = "https://github.com/chaitya-lab/core/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/chaitya_sdk"]

